<!DOCTYPE html>
<html lang="uz" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish | IDROK AI Platform Super Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="h-full antialiased font-sans flex items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950">

  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Ambient glow circle -->
    <div class="absolute -top-24 -right-24 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 mx-auto flex items-center justify-center text-white text-2xl font-black shadow-xl shadow-emerald-500/20 mb-4">
        IA
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">IDROK AI</h1>
      <p class="text-xs font-semibold text-emerald-400 uppercase tracking-widest mt-1">Platform Super Admin</p>
      <p class="text-xs text-slate-400 mt-2">Barcha tashkilotlar, modullar va tizimni boshqarish markazi</p>
    </div>

    {% if error_message %}
    <div class="mb-6 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-medium flex items-center gap-3">
      <i class="fa-solid fa-triangle-exclamation text-rose-400 text-sm"></i>
      <span>{{ error_message }}</span>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="{% url 'admin_login' %}" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Elektron Pochta</label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          <input type="email" name="email" value="admin@idrok.uz" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white text-sm focus:border-emerald-500 focus:bg-slate-800 outline-none transition font-medium">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Parol</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          <input type="password" name="password" value="admin12345" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white text-sm focus:border-emerald-500 focus:bg-slate-800 outline-none transition font-medium">
        </div>
      </div>

      <div class="p-3 bg-slate-800/40 border border-slate-700/40 rounded-xl text-[11px] text-slate-400 flex items-start gap-2.5">
        <i class="fa-solid fa-circle-info text-emerald-400 mt-0.5"></i>
        <div>
          <span class="text-slate-300 font-semibold">Test SuperAdmin ma'lumotlari:</span><br>
          Login: <code class="text-emerald-400 font-mono">admin@idrok.uz</code> | Parol: <code class="text-emerald-400 font-mono">admin12345</code>
        </div>
      </div>

      <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition transform active:scale-[0.98]">
        Tizimga Kirish →
      </button>
    </form>

    <div class="mt-8 text-center border-t border-slate-800 pt-6">
      <a href="http://127.0.0.1:3000/debts" target="_blank" class="text-xs text-slate-400 hover:text-emerald-400 transition font-medium">
        ↗ Business POS Kassa Dashboardga o'tish (3000-port)
      </a>
    </div>
  </div>

</body>
</html>
