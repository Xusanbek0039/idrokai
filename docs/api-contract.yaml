openapi: 3.0.3
info:
  title: IDROK AI Shared Platform API
  version: 0.2.0
  description: |
    Proposed contract, awaiting approval; no implementation is implied.
    Same-origin session authentication. Fetch /auth/csrf and send X-CSRFToken
    on every unsafe request, including login and registration. All company paths
    require active membership; foreign-company resources return 404. Owner/admin
    manage memberships and knowledge for existing generic roles. Education roles
    do not inherit generic CRM/work/knowledge/assistant grants; deny until explicitly mapped.
    Only owners may grant/revoke ownership; a company must retain an owner.
    Unknown input properties are rejected. All timestamps use UTC RFC3339.
    Idempotency keys are retained 24 hours, scoped by user/company/operation; stored body hash detects conflicts.
    Matching retries replay the response; changed or pending duplicates return 409.
    Default error responses cover 400, 401, 403, 404, 409, 413, 415, 429 and 503
    with the Error schema; throttled responses include Retry-After seconds.
    Education extends the same backend/authentication and Company tenant identity.
    All education operations require active user, active membership, active company,
    business-type eligibility, effective module plus prerequisites, action and object scope.
    Platform status never bypasses education operational membership/module checks.
    Student/teacher scopes and field redaction follow docs/roles-permissions.md.
    Foreign references/out-of-scope objects return 404; verified-tenant disabled module
    returns 403 MODULE_DISABLED, role denial 403 PERMISSION_DENIED, ineligible type
    403 MODULE_INELIGIBLE and suspended company 403 ORGANIZATION_INACTIVE.
    HTTP 409 covers dependency conflicts, stale versions and duplicate business keys.
    Financial operations require decimal-string amounts, atomic immutable postings,
    authorization before idempotency replay and permanent business uniqueness.
    Module disable preserves data and blocks background business actions.
    x-required-modules lists conjunctive gates; core denotes infrastructure and
    parent_module denotes the owning resource module, resolved server-side.
    Unknown operations and unsupported methods deny by default.
servers:
  - url: /api/v1
security:
  - sessionAuth: []
paths:
  /auth/csrf:
    get:
      operationId: getCsrf
      security: []
      summary: Bootstrap CSRF cookie and token
      responses:
        '200':
          description: Token for X-CSRFToken; also sets CSRF cookie
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /auth/register:
    post:
      operationId: register
      security: []
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      summary: Register and queue email verification; does not create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, name]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password, minLength: 12, maxLength: 128}
                name: {type: string, minLength: 1, maxLength: 150}
      responses:
        '202': {description: Generic verification instructions; does not reveal email existence}
        default: {$ref: '#/components/responses/Error'}
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody: {$ref: '#/components/requestBodies/Token'}
      responses:
        '204': {description: Email verified; token consumed}
        default: {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: login
      security: []
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Verified user authenticated; rotates and sets sessionid cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '204': {description: Session invalidated}
        default: {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /companies:
    get:
      operationId: listCompanies
      summary: List companies where current user is an active member
      responses:
        '200':
          description: Membership-scoped companies
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Company'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createCompany
      summary: Verified user creates company and owner membership atomically
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyInput'}
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: getCompany
      responses:
        '200':
          description: Current company
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateCompany
      summary: Owner updates company settings
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                timezone: {type: string, description: Valid IANA timezone}
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Company'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/memberships:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: listMemberships
      summary: Role-scoped directory; education learners never receive the whole staff membership directory
      responses:
        '200':
          description: Active members (pilot maximum 50)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Membership'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/memberships/{id}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {$ref: '#/components/parameters/Id'}
    patch:
      operationId: changeMembershipRole
      summary: Business-type-valid membership administrator only; enforce education role limits and preserve last owner
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {$ref: '#/components/schemas/Role'}
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeMembership
      summary: Business-type-valid membership administrator deactivates within role limits; preserve last owner
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '204': {description: Membership deactivated; assigned tasks become unassigned}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/invitations:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    post:
      operationId: inviteMember
      summary: Business-type-valid membership administrator invites within role limits; only owner may invite an owner
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: '#/components/schemas/Role'}
      responses:
        '202':
          description: Invitation persisted; email queued; expires in 72 hours
          content:
            application/json:
              schema:
                type: object
                required: [id, expires_at]
                properties:
                  id: {type: string, format: uuid}
                  expires_at: {type: string, format: date-time}
        default: {$ref: '#/components/responses/Error'}
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Single-use token must match authenticated verified email
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody: {$ref: '#/components/requestBodies/Token'}
      responses:
        '200':
          description: Membership activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/contacts:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: listContacts
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - name: include_archived
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Contacts ordered by created_at descending, id descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/Contact'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createContact
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ContactInput'}
                - required: [name]
      responses:
        '201':
          description: Created contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/contacts/{id}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getContact
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateContact
      summary: Update contact; set archived=true to archive
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactInput'}
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/tasks:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: listTasks
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TaskStatus'}
        - name: assignee_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Tasks ordered by created_at descending, id descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTask
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/TaskInput'}
                - required: [title]
      responses:
        '201':
          description: Created task; default status todo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/tasks/{id}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getTask
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateTask
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskInput'}
      responses:
        '200':
          description: Updated task; entering done sets completed_at, leaving done clears it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/documents:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: listDocuments
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Documents ordered by created_at descending, id descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: uploadDocument
      summary: Owner/admin uploads PDF, TXT, Markdown; maximum 10 MiB
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, file]
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
                file: {type: string, format: binary, description: Maximum 10485760 bytes; validated by content}
      responses:
        '202':
          description: Ingestion queued; poll Location
          headers:
            Location: {schema: {type: string}, description: Company-scoped document detail URL}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/documents/{id}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getDocument
      responses:
        '200':
          description: Document and ingestion status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeDocument
      summary: Owner/admin immediately excludes document from retrieval and queues erasure
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      responses:
        '204': {description: Hidden immediately; physical cleanup asynchronous}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/conversations:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: listConversations
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Company-visible conversations ordered by created_at descending, id descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createConversation
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/conversations/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: listMessages
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Messages ordered by created_at ascending, id ascending; inaccessible source content suppressed
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/Message'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: submitMessage
      summary: Persist user message and queue answer; one active run per conversation, otherwise 409
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 8000}
      responses:
        '202':
          description: Accepted after quota reservation; poll Location
          headers:
            Location: {schema: {type: string}, description: Company-scoped assistant-run URL}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantRun'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/assistant-runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getAssistantRun
      summary: Poll at most once per two seconds; queued/running transition to succeeded/failed
      responses:
        '200':
          description: Durable run status; successful output also appears in conversation messages
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantRun'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/audit-events:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: listAuditEvents
      summary: Owner/admin only; read-only metadata
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Events ordered by created_at descending, id descending
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/AuditEvent'}
        default: {$ref: '#/components/responses/Error'}
  /companies/{company_id}/usage:
    parameters:
      - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: getUsage
      summary: Owner/admin current calendar-month usage in UTC
      responses:
        '200':
          description: Usage and enforced internal quota; not an invoice
          content:
            application/json:
              schema:
                type: object
                required: [period_start, period_end, input_tokens, output_tokens, reserved_tokens, token_limit]
                properties:
                  period_start: {type: string, format: date-time}
                  period_end: {type: string, format: date-time}
                  input_tokens: {type: integer, minimum: 0}
                  output_tokens: {type: integer, minimum: 0}
                  reserved_tokens: {type: integer, minimum: 0}
                  token_limit: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  "/companies/{company_id}/capabilities": {
    "parameters": [
      {
        "$ref": "#/components/parameters/CompanyId"
      }
    ],
    "get": {
      "operationId": "getEffectiveCapabilities",
      "summary": "Current authenticated member effective modules and permissions; no-store",
      "x-required-modules": [
        "core"
      ],
      "x-required-permission": "modules.read",
      "x-object-scope": "self",
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EffectiveCapabilities"
              }
            }
          },
          "headers": {
            "Cache-Control": {
              "schema": {
                "type": "string",
                "enum": [
                  "no-store"
                ]
              }
            }
          }
        },
        "default": {
          "$ref": "#/components/responses/Error"
        }
      }
    }
  }
  "/companies/{company_id}/modules": {
    "parameters": [
      {
        "$ref": "#/components/parameters/CompanyId"
      }
    ],
    "get": {
      "operationId": "getEffectiveModules",
      "summary": "Current authenticated member effective modules and permissions; no-store",
      "x-required-modules": [
        "core"
      ],
      "x-required-permission": "modules.read",
      "x-object-scope": "self",
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/EffectiveCapabilities"
              }
            }
          },
          "headers": {
            "Cache-Control": {
              "schema": {
                "type": "string",
                "enum": [
                  "no-store"
                ]
              }
            }
          }
        },
        "default": {
          "$ref": "#/components/responses/Error"
        }
      }
    }
  }
  "/companies/{company_id}/education/students": {
    "parameters": [
      {
        "$ref": "#/components/parameters/CompanyId"
      }
    ],
    "get": {
      "operationId": "listEducationStudentProfile",
      "summary": "Scoped list; role-specific field filtering; module gate applies before data access",
      "x-required-modules": [
        "edu_students"
      ],
      "x-required-permission": "registry.read",
      "x-object-scope": "organization_or_assigned_groups_or_self",
      "parameters": [
        {
          "$ref": "#/components/parameters/Limit"
        },
        {
          "$ref": "#/components/parameters/Offset"
        }
      ],
      "responses": {
        "200": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StudentProfilePage"
              }
            }
          }
        },
        "default": {
          "$ref": "#/components/responses/Error"
        }
      },
      "description": "Teacher reads currently assigned minimal rosters; student reads own profile or active group membership. Guardian contacts/medical notes/finance fields excluded."
    },
    "post": {
      "operationId": "createEducationStudentProfile",
      "summary": "Create through tenant application service; repeated idempotent request replays",
      "x-required-modules": [
        "edu_students"
      ],
      "x-required-permission": "registry.manage",
      "x-object-scope": "organization_or_assigned_groups_or_self",
      "parameters": [
        {
          "$ref": "#/components/parameters/Csrf"
        },
        {
          "$ref": "#/components/parameters/Idempotency"
        }
      ],
      "requestBody": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/StudentProfileInput"
            }
          }
        }
      },
      "responses": {
        "201": {
          "description": "Success",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StudentProfile"
              }
            }
          }
        },
        "default": {
          "$ref": "#/components/responses/Error"
        }
      }
    }
  }
  "/companies/{company_id}/education/students/{id}": {
    "parameters": [
      {
        "$ref": "#/components/parameters/CompanyId"
      },
      {
        "$ref": "#/components/parameters/Id"
      }
    ],
    "get": {
      "operationId": "getEducationStudentProfile",
      "x-required-modules": [
        "edu_students"
      ],
      "x-required-permission": "registry.read",
      "x-object-scope": "organization_or_assigned_groups_or_self",
      "responses": {
        "200": {
          "description": "Success",
          "content": {
