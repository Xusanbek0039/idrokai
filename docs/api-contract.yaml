components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Server-side session; Secure, HttpOnly, SameSite=Lax
  parameters:
    CompanyId:
      name: company_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Csrf:
      name: X-CSRFToken
      in: header
      required: true
      schema: {type: string}
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  requestBodies:
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token: {type: string, minLength: 1, maxLength: 512}
  responses:
    Error:
      description: Structured failure; HTTP status specifies category
      headers:
        X-Request-ID:
          schema: {type: string}
        Retry-After:
          description: Seconds until retry; provided on 429 and temporary 503 where known
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: {type: string, example: validation_error}
        message: {type: string}
        request_id: {type: string}
        fields:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    Page:
      type: object
      required: [count, next, previous, results]
      properties:
        count: {type: integer, minimum: 0}
        next: {type: string, nullable: true, description: Relative same-origin pagination URL}
        previous: {type: string, nullable: true}
        results:
          type: array
          items: {type: object}
    User:
      type: object
      required: [id, email, name, email_verified]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        email_verified: {type: boolean}
    Role:
      type: string
      enum: [owner, admin, staff, shop_owner, shop_manager, cashier, accountant, edu_owner, edu_assistant_admin, edu_operations_manager, teacher, student]
    CompanyInput:
      type: object
      additionalProperties: false
      required: [name, industry, timezone]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        industry: {type: string, enum: [general, clinic, education, retail, hospitality]}
        timezone: {type: string, example: Asia/Tashkent, description: Valid IANA timezone}
    Company:
      type: object
      required: [id, name, industry, timezone, my_role, enabled_modules, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        industry: {type: string, enum: [general, clinic, education, retail, hospitality]}
        timezone: {type: string}
        my_role: {$ref: '#/components/schemas/Role'}
        enabled_modules:
          type: array
          items: {type: string, enum: [crm, work, knowledge, assistant, retail_customers, retail_debts, retail_inventory, retail_pos, retail_reports, retail_reminders, edu_students, edu_groups, edu_classrooms, edu_scheduling, edu_attendance, edu_tuition, edu_debts, edu_homework, edu_exams, edu_lms, edu_gamification, edu_reports]}
        created_at: {type: string, format: date-time}
    Membership:
      type: object
      required: [id, company_id, user_id, display_name, role]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
    ContactInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, format: email, nullable: true}
        phone: {type: string, maxLength: 32, nullable: true}
        category: {type: string, maxLength: 80, nullable: true}
        notes: {type: string, maxLength: 4000}
        archived: {type: boolean}
    Contact:
      type: object
      required: [id, company_id, name, archived, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email, nullable: true}
        phone: {type: string, nullable: true}
        category: {type: string, nullable: true}
        notes: {type: string}
        archived: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaskStatus:
      type: string
      enum: [todo, in_progress, done, cancelled]
    TaskInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 4000}
        contact_id: {type: string, format: uuid, nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true, description: Active company membership ID}
        due_at: {type: string, format: date-time, nullable: true}
        status: {$ref: '#/components/schemas/TaskStatus'}
    Task:
      type: object
      required: [id, company_id, title, status, created_at, updated_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        contact_id: {type: string, format: uuid, nullable: true}
        assignee_id: {type: string, format: uuid, nullable: true}
        due_at: {type: string, format: date-time, nullable: true}
        status: {$ref: '#/components/schemas/TaskStatus'}
        completed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Document:
      type: object
      required: [id, company_id, title, version, status, error_code, created_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        title: {type: string}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [queued, processing, ready, failed]}
        error_code: {type: string, nullable: true, description: Safe code; e.g. unsupported_content or ingestion_failed}
        created_at: {type: string, format: date-time}
    Conversation:
      type: object
      required: [id, company_id, title, created_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
    Citation:
      type: object
      required: [document_id, document_version, chunk_id, title, excerpt]
      properties:
        document_id: {type: string, format: uuid}
        document_version: {type: integer, minimum: 1}
        chunk_id: {type: string, format: uuid}
        title: {type: string}
        excerpt: {type: string, maxLength: 500}
    Message:
      type: object
      required: [id, conversation_id, role, content, citations, created_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        content: {type: string, description: Removed-source answers may be replaced by a source-unavailable notice}
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        created_at: {type: string, format: date-time}
    AssistantRun:
      type: object
      required: [id, conversation_id, user_message_id, status, assistant_message_id, error_code, created_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        user_message_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        assistant_message_id: {type: string, format: uuid, nullable: true, description: Non-null on success}
        error_code: {type: string, nullable: true, description: Non-null on failure; e.g. provider_timeout or membership_revoked}
        created_at: {type: string, format: date-time}
    AuditEvent:
      type: object
      required: [id, company_id, actor_user_id, action, resource_type, resource_id, created_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        actor_user_id: {type: string, format: uuid, nullable: true}
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}

    EducationRole: {
      "type": "string",
      "enum": [
        "edu_owner",
        "edu_assistant_admin",
        "edu_operations_manager",
